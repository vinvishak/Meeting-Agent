<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Prism — Engineering Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔷</text></svg>">
  <style>
    /* ── Design tokens ── */
    :root {
      --blue:           #2563eb;
      --amber:          #d97706;
      --red:            #dc2626;
      --green:          #16a34a;
      --grey:           #6b7280;
      --bg:             #f3f4f6;
      --surface:        #ffffff;
      --surface-2:      #f9fafb;
      --text:           #111827;
      --text-2:         #374151;
      --border:         #e5e7eb;
      --radius:         8px;
      --tree-connector: #d1d5db;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { cursor: pointer; font-family: inherit; }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--blue), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .header-search {
      flex: 1;
      max-width: 380px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }
    .header-search:focus { outline: none; border-color: var(--blue); background: var(--surface); box-shadow: 0 0 0 3px #dbeafe; }
    .header-filter {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
    }

    /* ── Nav tabs ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 2px;
      overflow-x: auto;
      position: sticky;
      top: 56px;
      z-index: 99;
    }
    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--grey);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    nav button:hover { color: var(--text); }
    nav button.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* ── Main content ── */
    main { padding: 24px; max-width: 1280px; margin: 0 auto; }
    section { display: none; }
    section.active { display: block; }
    .section-heading { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

    /* ── Shared states ── */
    .loading { color: var(--grey); font-style: italic; padding: 20px 0; }
    .error   { color: var(--red); padding: 8px 0; }
    .empty   { color: var(--grey); padding: 20px 0; }

    /* ── Buttons ── */
    .btn { padding: 6px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: opacity 0.15s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }
    .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-on_track    { background: #dcfce7; color: var(--green); }
    .badge-at_risk     { background: #fef3c7; color: var(--amber); }
    .badge-blocked     { background: #fee2e2; color: var(--red); }
    .badge-inactive    { background: #f3f4f6; color: var(--grey); }
    .badge-done        { background: #dcfce7; color: var(--green); }
    .badge-in_progress { background: #dbeafe; color: var(--blue); }
    .badge-not_started { background: #f3f4f6; color: var(--grey); }
    .badge-high        { background: #fee2e2; color: var(--red); }
    .badge-medium      { background: #fef3c7; color: var(--amber); }
    .badge-low         { background: #dcfce7; color: var(--green); }
    .badge-none        { background: #f3f4f6; color: var(--grey); }
    .badge-blocker     { background: #fee2e2; color: var(--red); }
    .badge-decision    { background: #dbeafe; color: var(--blue); }
    .badge-risk        { background: #fef3c7; color: var(--amber); }
    .badge-action      { background: #f3e8ff; color: #7c3aed; }
    .sim-high          { background: #fee2e2; color: var(--red); border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .sim-medium        { background: #fef3c7; color: var(--amber); border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .sim-low           { background: #f3f4f6; color: var(--grey); border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    thead { background: var(--bg); }
    th { padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }

    /* ── Progress bar ── */
    .progress-wrap { margin-top: 6px; }
    .progress-label { font-size: 12px; color: var(--grey); margin-bottom: 4px; }
    .progress-bar { background: var(--border); border-radius: 9999px; height: 8px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 9999px; transition: width 0.4s ease; }
    .pf-green { background: var(--green); }
    .pf-amber { background: var(--amber); }
    .pf-blue  { background: var(--blue); }
    .pf-red   { background: var(--red); }

    /* ── Metric grid ── */
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .metric-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
    .metric-tile .mv { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .metric-tile .ml { font-size: 12px; color: var(--grey); }
    .c-green .mv { color: var(--green); }
    .c-amber .mv { color: var(--amber); }
    .c-red   .mv { color: var(--red); }
    .c-blue  .mv { color: var(--blue); }
    .c-grey  .mv { color: var(--grey); }

    /* ── Health scorecard ── */
    .health-scorecard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; display: flex; align-items: center; gap: 28px; margin-bottom: 20px; }
    .health-ring { width: 116px; height: 116px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .health-ring-inner { width: 82px; height: 82px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; }
    .health-score-num { font-size: 24px; font-weight: 800; line-height: 1; }
    .health-score-lbl { font-size: 10px; color: var(--grey); }
    .health-text h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .health-text p { font-size: 13px; color: var(--grey); }

    /* ── Goal-to-Execution Tree ── */
    .tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; overflow-x: auto; }
    .tree-wrap h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--text-2); }
    .tree ul { list-style: none; padding-left: 0; }
    .tree ul ul { padding-left: 20px; border-left: 1px solid var(--tree-connector); margin-left: 8px; }
    .tree li { position: relative; }
    .tree ul ul li { padding: 2px 0 2px 12px; }
    .tree ul ul li::before { content: ''; position: absolute; left: 0; top: 13px; width: 12px; height: 1px; background: var(--tree-connector); }
    .tree-node-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; user-select: none; }
    .tree-node-row:hover { background: var(--bg); }
    .tree-caret { font-size: 9px; color: var(--grey); width: 10px; flex-shrink: 0; transition: transform 0.15s; }
    .tree-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-on_track { background: var(--green); }
    .dot-at_risk  { background: var(--amber); }
    .dot-blocked  { background: var(--red); }
    .dot-inactive { background: #d1d5db; }
    .dot-stale    { background: var(--amber); }
    .tree-label { font-size: 13px; }
    .tree-layer-tag { font-size: 11px; color: var(--grey); background: var(--bg); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
    .tree-tooltip-text { font-size: 11px; color: var(--red); }
    .tree-children.hidden { display: none; }

    /* ── Goals layout ── */
    .goals-layout { display: flex; gap: 24px; align-items: flex-start; }
    .goals-list-panel { width: 260px; flex-shrink: 0; }
    .goals-list-panel h3 { font-size: 12px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .goal-item { padding: 10px 12px; border-radius: var(--radius); cursor: pointer; font-size: 14px; border: 1px solid transparent; margin-bottom: 4px; }
    .goal-item:hover { background: var(--bg); }
    .goal-item.active { background: #dbeafe; border-color: #bfdbfe; color: var(--blue); font-weight: 500; }
    .goal-detail-panel { flex: 1; min-width: 0; }
    .goal-prompt { color: var(--grey); padding: 40px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .goal-detail-header { margin-bottom: 20px; }
    .goal-detail-header h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .goal-layers { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .goal-layer-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .goal-layer-label { font-size: 13px; color: var(--grey); }
    .goal-layer-value { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    /* ── Team cards ── */
    .teams-list { display: flex; flex-direction: column; gap: 12px; }
    .team-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); border-left: 4px solid var(--border); overflow: hidden; }
    .team-card.status-blocked  { border-left-color: var(--red); }
    .team-card.status-at_risk  { border-left-color: var(--amber); }
    .team-card.status-on_track { border-left-color: var(--green); }
    .team-card-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; cursor: pointer; }
    .team-card-header:hover { background: var(--surface-2); }
    .team-name { font-size: 15px; font-weight: 600; flex: 1; }
    .team-caret { font-size: 12px; color: var(--grey); transition: transform 0.2s; margin-left: auto; }
    .team-card.expanded .team-caret { transform: rotate(180deg); }
    .team-sprint-bar { padding: 0 20px 8px; }
    .team-metrics-row { display: flex; gap: 24px; padding: 0 20px 12px; }
    .team-metric .tm-val { font-size: 20px; font-weight: 700; }
    .team-metric .tm-lbl { font-size: 11px; color: var(--grey); }
    .team-summary { padding: 0 20px 12px; font-size: 13px; color: var(--grey); font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; }
    .sprint-board-wrap { display: none; padding: 12px 20px 16px; border-top: 1px solid var(--border); }
    .team-card.expanded .sprint-board-wrap { display: block; }

    /* ── Meeting cards ── */
    .meeting-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .meeting-meta { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
    .meeting-name { font-size: 15px; font-weight: 600; }
    .meeting-date { font-size: 12px; color: var(--grey); }
    .meeting-bullets h4 { font-size: 12px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .meeting-bullets ul { padding-left: 18px; margin-bottom: 16px; }
    .meeting-bullets li { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }

    /* ── Project cards ── */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: box-shadow 0.15s; }
    .project-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .project-card.selected { border-color: var(--blue); box-shadow: 0 0 0 2px #bfdbfe; }
    .project-card-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .project-card-meta { font-size: 12px; color: var(--grey); display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .project-detail-panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .project-detail-panel.visible { display: block; }
    .project-detail-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    .project-detail-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .project-detail-meta { display: flex; gap: 16px; font-size: 13px; color: var(--grey); flex-wrap: wrap; align-items: center; }
    .detail-section { margin-bottom: 24px; }
    .detail-section-heading { font-size: 12px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }

    /* ── Timeline phases ── */
    .timeline-row { display: flex; align-items: flex-start; gap: 0; }
    .phase-step { flex: 1; text-align: center; position: relative; }
    .phase-connector { position: absolute; top: 13px; left: 50%; right: -50%; height: 2px; background: var(--border); z-index: 0; }
    .phase-step:last-child .phase-connector { display: none; }
    .phase-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; font-size: 11px; position: relative; z-index: 1; }
    .phase-dot.done        { background: var(--green); border-color: var(--green); color: #fff; }
    .phase-dot.in_progress { background: var(--blue); border-color: var(--blue); color: #fff; }
    .phase-dot.not_started { background: var(--surface); border-color: var(--border); color: var(--grey); }
    .phase-label { font-size: 11px; color: var(--grey); }

    /* ── Activity feed ── */
    .activity-feed { display: flex; flex-direction: column; gap: 8px; }
    .activity-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); }
    .activity-icon { font-size: 16px; flex-shrink: 0; }
    .activity-text { font-size: 13px; flex: 1; }
    .activity-time { font-size: 11px; color: var(--grey); white-space: nowrap; }

    /* ── Duplicate clusters ── */
    .dup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .dup-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .dup-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .dup-theme { font-size: 15px; font-weight: 600; }
    .dup-teams { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .dup-team-tag { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 12px; color: var(--grey); }
    .dup-recommendation { font-size: 13px; color: var(--text-2); }

    /* ── Insight cards ── */
    .insights-list { display: flex; flex-direction: column; gap: 16px; }
    .insight-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .insight-body { font-size: 14px; font-weight: 500; margin-bottom: 14px; line-height: 1.6; }
    .insight-sections { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
    .insight-row { display: flex; gap: 12px; font-size: 13px; }
    .insight-row-label { font-weight: 600; color: var(--grey); min-width: 150px; flex-shrink: 0; }
    .insight-row-value { color: var(--text-2); flex: 1; }
    .insight-links { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .insight-link { background: #dbeafe; color: var(--blue); border: none; border-radius: 4px; padding: 3px 10px; font-size: 12px; font-weight: 500; cursor: pointer; }
    .insight-link:hover { opacity: 0.82; }

    /* ── AI sub-headings ── */
    .ai-heading { font-size: 17px; font-weight: 700; margin: 0 0 16px; }
    .ai-heading + * { }
    .ai-section { margin-bottom: 32px; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <h1>Prism</h1>
  <input id="search-input" class="header-search" type="search" placeholder="Search…" oninput="onSearch(this.value)">
  <select id="header-filter" class="header-filter" onchange="onFilter(this.value)">
    <option value="">All Statuses</option>
    <option value="on_track">On Track</option>
    <option value="at_risk">At Risk</option>
    <option value="blocked">Blocked</option>
  </select>
</header>

<!-- ── Nav tabs ── -->
<nav id="nav">
  <button class="active" data-section="section-overview">Org Overview</button>
  <button data-section="section-goals">Goals</button>
  <button data-section="section-teams">Teams</button>
  <button data-section="section-projects">Projects</button>
  <button data-section="section-meetings">Meetings</button>
  <button data-section="section-ai">AI</button>
</nav>

<!-- ── Main content ── -->
<main>

  <section id="section-overview" class="active">
    <h2 class="section-heading">Organization Overview</h2>
    <div id="overview-content"><p class="loading">Loading overview…</p></div>
  </section>

  <section id="section-goals">
    <h2 class="section-heading">Leadership Goals</h2>
    <div id="goals-content"><p class="loading">Loading goals…</p></div>
  </section>

  <section id="section-teams">
    <h2 class="section-heading">Team Status</h2>
    <div id="teams-content"><p class="loading">Loading teams…</p></div>
  </section>

  <section id="section-projects">
    <h2 class="section-heading">Projects</h2>
    <div id="projects-content"><p class="loading">Loading projects…</p></div>
    <div id="project-detail-panel" class="project-detail-panel"></div>
  </section>

  <section id="section-meetings">
    <h2 class="section-heading">Meeting Intelligence</h2>
    <div id="meetings-content"><p class="loading">Loading meetings…</p></div>
  </section>

  <section id="section-ai">
    <h2 class="section-heading">AI Intelligence</h2>
    <div id="ai-content"><p class="loading">Loading AI data…</p></div>
  </section>

</main>

<script>
  /* ── Config ── */
  const API_BASE  = 'http://localhost:8000';
  const TOKEN     = 'dev';
  const JIRA_BASE = 'https://vinv8290.atlassian.net';

  /* ── API helper ── */
  async function api(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(options.headers || {}) },
      ...options,
    });
    if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`HTTP ${res.status}: ${t}`); }
    return res.json();
  }

  /* ── Utilities ── */
  function escHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function relativeTime(iso) {
    if (!iso) return '—';
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    return d < 30 ? `${d}d ago` : `${Math.floor(d / 30)}mo ago`;
  }

  const STATUS_LABELS = {
    on_track: 'On Track', at_risk: 'At Risk', blocked: 'Blocked', inactive: 'No Data',
    done: 'Done', in_progress: 'In Progress', not_started: 'Not Started',
    high: 'High', medium: 'Medium', low: 'Low', none: 'None',
    blocker: 'Blocker', decision: 'Decision', risk: 'Risk', action: 'Action',
  };

  function badge(status) {
    const s = String(status || '').toLowerCase();
    return `<span class="badge badge-${escHtml(s)}">${escHtml(STATUS_LABELS[s] || status)}</span>`;
  }

  function errHtml(msg, fn) {
    return `<p class="error">${escHtml(msg)} <button class="btn btn-primary" onclick="${fn}()">Retry</button></p>`;
  }

  function pfClass(pct) { return pct >= 70 ? 'pf-green' : pct >= 40 ? 'pf-amber' : 'pf-red'; }

  /* ──────────────────────────────────────────
     Navigation
  ────────────────────────────────────────── */
  const loaded = new Set();
  let activeSection = 'section-overview';

  const TAB_LOADERS = {
    'section-overview':  loadOrgOverview,
    'section-goals':     loadGoals,
    'section-teams':     loadTeams,
    'section-projects':  loadProjects,
    'section-meetings':  loadMeetings,
    'section-ai':        loadAI,
  };

  function activateTab(sectionId) {
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.section === sectionId));
    document.querySelectorAll('main section').forEach(s => s.classList.toggle('active', s.id === sectionId));
    activeSection = sectionId;
    if (!loaded.has(sectionId)) { loaded.add(sectionId); TAB_LOADERS[sectionId]?.(); }
  }

  document.querySelectorAll('#nav button').forEach(btn => btn.addEventListener('click', () => activateTab(btn.dataset.section)));

  /* ── Search & Filter ── */
  function onSearch(q) {
    const lq = q.toLowerCase();
    if (activeSection === 'section-teams')    filterCards('.team-card',    '.team-name',         lq);
    if (activeSection === 'section-projects') filterCards('.project-card', '.project-card-name', lq);
    if (activeSection === 'section-meetings') filterCards('.meeting-card', '.meeting-name',      lq);
  }

  function onFilter(val) {
    if (activeSection === 'section-teams') {
      document.querySelectorAll('.team-card').forEach(c => { c.style.display = (!val || c.dataset.status === val) ? '' : 'none'; });
    }
  }

  function filterCards(cardSel, labelSel, q) {
    document.querySelectorAll(cardSel).forEach(card => {
      const text = (card.querySelector(labelSel)?.textContent || '').toLowerCase();
      card.style.display = (!q || text.includes(q)) ? '' : 'none';
    });
  }

  /* ── navigateTo (used by AI insight links) ── */
  function navigateTo(type, id) {
    const sectionMap = { team: 'section-teams', project: 'section-projects', ticket: 'section-meetings' };
    activateTab(sectionMap[type] || 'section-overview');
  }

  /* ──────────────────────────────────────────
     US1 — Org Overview & Goal-to-Execution Tree
  ────────────────────────────────────────── */
  /* ──────────────────────────────────────────
     GitHub sync status (fetched once, used by tree renderer)
  ────────────────────────────────────────── */
  let githubSyncStatus = { status: 'inactive', totalCommits: 0, tooltip: 'GitHub sync pending' };

  async function fetchGitHubStatus() {
    try {
      const data = await api('/api/v1/github/repos');
      const totalCommits = (data.repos || []).reduce((s, r) => s + (r.commit_count || 0), 0);
      if (data.synced_count > 0) {
        githubSyncStatus = { status: 'active', totalCommits, tooltip: `${totalCommits} commits synced` };
      } else if (data.total > 0) {
        githubSyncStatus = { status: 'inactive', totalCommits: 0, tooltip: 'GitHub sync pending' };
      }
    } catch {
      githubSyncStatus = { status: 'stale', totalCommits: 0, tooltip: 'GitHub data may be outdated' };
    }
  }

  async function loadOrgOverview() {
    const el = document.getElementById('overview-content');
    el.innerHTML = '<p class="loading">Loading overview…</p>';
    try {
      const [health, tree] = await Promise.all([
        api('/api/v1/org/health'),
        api('/api/v1/org/tree'),
        fetchGitHubStatus(),
      ]);
      const pct = health.health_score || 0;
      const scoreColor = pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
      el.innerHTML = `
        <div class="health-scorecard">
          <div class="health-ring" style="background: conic-gradient(${scoreColor} 0% ${pct}%, var(--border) ${pct}% 100%)">
            <div class="health-ring-inner">
              <span class="health-score-num" style="color:${scoreColor}">${pct}%</span>
              <span class="health-score-lbl">Health</span>
            </div>
          </div>
          <div class="health-text">
            <h2>Organization Execution Health</h2>
            <p>Across goals, projects, tickets, meetings, and detected patterns</p>
          </div>
        </div>
        <div class="metric-grid">
          <div class="metric-tile c-green"><div class="mv">${health.goals_on_track_pct ?? 0}%</div><div class="ml">Goals On Track</div></div>
          <div class="metric-tile c-amber"><div class="mv">${health.projects_at_risk ?? 0}</div><div class="ml">Projects at Risk</div></div>
          <div class="metric-tile c-red"><div class="mv">${health.blocked_tickets ?? 0}</div><div class="ml">Blocked Tickets</div></div>
          <div class="metric-tile c-blue"><div class="mv">${health.duplicate_work_areas ?? 0}</div><div class="ml">Duplicate Areas</div></div>
          <div class="metric-tile c-grey"><div class="mv">${health.meeting_updates_avoided ?? 0}</div><div class="ml">Meeting Updates Avoided</div></div>
        </div>
        <div class="tree-wrap">
          <h3>Goal-to-Execution Tree — click any node to expand</h3>
          <div class="tree" id="exec-tree"></div>
        </div>`;
      const treeEl = document.getElementById('exec-tree');
      const root = document.createElement('ul');
      root.appendChild(buildTreeNode(tree));
      treeEl.appendChild(root);
    } catch {
      el.innerHTML = errHtml('Could not load overview.', 'loadOrgOverview');
    }
  }

  const LAYER_LABELS = {
    company_goal: 'Company Goal', department_objective: 'Dept Objective',
    team_initiative: 'Team Initiative', epic: 'Epic', ticket: 'Ticket',
    github: 'GitHub', meeting_update: 'Meeting Update',
  };

  function buildTreeNode(node) {
    const li = document.createElement('li');
    const hasChildren = node.children && node.children.length > 0;

    const row = document.createElement('div');
    row.className = 'tree-node-row';

    const caret = document.createElement('span');
    caret.className = 'tree-caret';
    caret.textContent = hasChildren ? '▶' : ' ';

    const isGitHub = node.layer === 'github';
    const effectiveStatus = isGitHub ? githubSyncStatus.status : (node.status || 'inactive');

    const dot = document.createElement('span');
    dot.className = `tree-dot dot-${effectiveStatus}`;

    const label = document.createElement('span');
    label.className = 'tree-label';
    label.textContent = node.label;

    const layerTag = document.createElement('span');
    layerTag.className = 'tree-layer-tag';
    layerTag.textContent = LAYER_LABELS[node.layer] || node.layer;

    row.append(caret, dot, label, layerTag);

    if (isGitHub) {
      const tip = document.createElement('span');
      tip.className = 'tree-tooltip-text';
      tip.style.color = effectiveStatus === 'active' ? 'var(--green)' : effectiveStatus === 'stale' ? 'var(--amber)' : 'var(--grey)';
      tip.textContent = githubSyncStatus.tooltip;
      row.appendChild(tip);
    } else if (node.status === 'blocked' && node.tooltip) {
      const tip = document.createElement('span');
      tip.className = 'tree-tooltip-text';
      tip.textContent = `⚠ ${node.tooltip}`;
      row.appendChild(tip);
    }

    li.appendChild(row);

    if (hasChildren) {
      const childUl = document.createElement('ul');
      childUl.className = 'tree-children hidden';
      node.children.forEach(child => childUl.appendChild(buildTreeNode(child)));
      li.appendChild(childUl);

      row.addEventListener('click', () => {
        const isHidden = childUl.classList.toggle('hidden');
        caret.textContent = isHidden ? '▶' : '▼';
      });
    }

    return li;
  }

          <div class="goal-layer-row"><span class="goal-layer-label">PRs Merged This Week</span><span class="goal-layer-value">${g.prs_merged_this_week ?? 0}</span></div>

  /* ──────────────────────────────────────────
     US3 — Team Status
  ────────────────────────────────────────── */
  const _sprintCache = {};

  async function loadTeams() {
    const el = document.getElementById('teams-content');
    el.innerHTML = '<p class="loading">Loading teams…</p>';
    try {
      const { teams = [] } = await api('/api/v1/teams');
      if (!teams.length) { el.innerHTML = '<p class="empty">No teams found.</p>'; return; }
      el.innerHTML = '<div class="teams-list" id="teams-list"></div>';
      const list = document.getElementById('teams-list');
      teams.forEach(t => {
        const card = document.createElement('div');
        card.className = `team-card status-${t.status}`;
        card.dataset.status = t.status;
        card.dataset.id = t.id;
        const pct = t.sprint_progress_pct;
        const sprintHtml = pct != null
          ? `<div class="team-sprint-bar"><div class="progress-label">Sprint ${pct}%</div><div class="progress-bar"><div class="progress-fill ${pfClass(pct)}" style="width:${pct}%"></div></div></div>`
          : `<p style="padding:0 20px 8px;font-size:13px;color:var(--grey)">No active sprint</p>`;
        card.innerHTML = `
          <div class="team-card-header" onclick="toggleTeam('${escHtml(t.id)}', this)">
            <span class="team-name">${escHtml(t.name)}</span>
            ${badge(t.status)}
            <span class="team-caret">▼</span>
          </div>
          ${sprintHtml}
          <div class="team-metrics-row">
            <div class="team-metric"><div class="tm-val" style="color:var(--red)">${t.blocked_tickets ?? 0}</div><div class="tm-lbl">Blocked</div></div>
            <div class="team-metric"><div class="tm-val" style="color:var(--green)">${t.prs_merged ?? 0}</div><div class="tm-lbl">PRs Merged</div></div>
            <div class="team-metric"><div class="tm-val">${t.open_prs ?? 0}</div><div class="tm-lbl">Open PRs</div></div>
          </div>
          ${t.last_meeting_summary ? `<div class="team-summary">"${escHtml(t.last_meeting_summary)}"</div>` : ''}
          <div class="sprint-board-wrap" id="sprint-${escHtml(t.id)}"><p class="loading" style="padding:4px 0">Loading sprint…</p></div>`;

      });

      el.innerHTML = errHtml('Could not load teams.', 'loadTeams');
    }

  async function toggleTeam(id, headerEl) {
    const card = headerEl.closest('.team-card');
    const expanded = card.classList.toggle('expanded');
    if (!expanded) return;
    if (_sprintCache[id]) { document.getElementById(`sprint-${id}`).innerHTML = _sprintCache[id]; return; }
    const wrap = document.getElementById(`sprint-${id}`);
    try {
      const { epics = [] } = await api(`/api/v1/teams/${id}/sprint`);
      _sprintCache[id] = epics.length === 0
        ? '<p class="empty" style="padding:4px 0">No sprint data.</p>'
        : `<div class="table-wrap"><table>
            <thead><tr><th>Epic</th><th>Tickets</th><th>Status</th><th>GitHub Activity</th><th>Meeting Mentions</th></tr></thead>
            <tbody>${epics.map(e => `<tr><td>${escHtml(e.name)}</td><td>${e.ticket_count}</td><td>${badge(e.status)}</td><td>${badge(e.github_activity)}</td><td>${e.meeting_mentions}</td></tr>`).join('')}</tbody>
           </table></div>`;
      wrap.innerHTML = _sprintCache[id];
    } catch {
      wrap.innerHTML = '<p class="error" style="padding:4px 0">Could not load sprint data.</p>';
    }
  }

  async function openProject(id) {
    document.querySelectorAll('.project-card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
    const panel = document.getElementById('project-detail-panel');
    panel.className = 'project-detail-panel visible';
    panel.innerHTML = '<p class="loading">Loading project details…</p>';
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    try {
      const p = await api(`/api/v1/projects/${id}`);
      const timelineHtml = (p.timeline || []).map(ph => {
        const icon = ph.status === 'done' ? '✓' : ph.status === 'in_progress' ? '●' : '';
        return `<div class="phase-step"><div class="phase-connector"></div><div class="phase-dot ${ph.status}">${icon}</div><div class="phase-label">${escHtml(ph.phase)}</div></div>`;
      }).join('');
      const workstreamHtml = (p.workstreams || []).map(w => `
        <tr>
          <td>${escHtml(w.name)}</td>
          <td>${escHtml(w.owner)}</td>
          <td><div class="progress-bar" style="width:100px"><div class="progress-fill ${pfClass(w.progress_pct)}" style="width:${w.progress_pct}%"></div></div><small style="color:var(--grey)">${w.progress_pct}%</small></td>
          <td>${badge(w.risk)}</td>
        </tr>`).join('');
      const ACTIVITY_ICONS = { github: '🔀', jira: '📋', meeting: '🗣' };

      // Fetch real GitHub commits for this project (non-blocking)
      let ghCommits = [];
      try {
        const ghData = await api('/api/v1/github/commits?limit=10').catch(() => ({ commits: [] }));
        ghCommits = (ghData.commits || []).map(c => ({
          source: 'github',
          text: `${c.author_login || 'unknown'}: ${c.message.split('\n')[0].slice(0, 80)}`,
          timestamp: c.committed_at,
          url: c.url,
        }));
      } catch { /* GitHub not synced — silently skip */ }

      const allActivity = [...ghCommits, ...(p.activity || [])].slice(0, 20);
      const activityHtml = allActivity.length ? allActivity.map(ev => `
        <div class="activity-item">
          <span class="activity-icon">${ACTIVITY_ICONS[ev.source] || '•'}</span>
          <span class="activity-text">${ev.url ? `<a href="${escHtml(ev.url)}" target="_blank" style="color:inherit">${escHtml(ev.text)}</a>` : escHtml(ev.text)}</span>
          <span class="activity-time">${relativeTime(ev.timestamp)}</span>
        </div>`).join('') : '';
      panel.innerHTML = `
        <div class="project-detail-top">
          <div>
            <div class="project-detail-title">${escHtml(p.name)}</div>
            <div class="project-detail-meta">${badge(p.status)} <span>👤 ${escHtml(p.owner)}</span> <span>📅 ${escHtml(p.target_date)}</span> <span style="font-weight:600">${p.confidence_pct}% confidence</span></div>
          </div>
          <button class="btn btn-ghost" onclick="closeProject()">✕ Close</button>
        </div>
        <div class="detail-section">
          <div class="detail-section-heading">Timeline</div>
          <div class="timeline-row">${timelineHtml}</div>
        </div>
        <div class="detail-section">
          <div class="detail-section-heading">Team Breakdown</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Workstream</th><th>Owner</th><th>Progress</th><th>Risk</th></tr></thead>
            <tbody>${workstreamHtml}</tbody>
          </table></div>
        </div>
        <div class="detail-section">
          <div class="detail-section-heading">Activity Feed</div>
          <div class="activity-feed">${activityHtml || '<p class="empty">No recent activity.</p>'}</div>
        </div>`;
    } catch {
      panel.innerHTML = errHtml('Could not load project details.', `() => openProject('${id}')`);
    }
  }

  function closeProject() {
    const panel = document.getElementById('project-detail-panel');
    panel.className = 'project-detail-panel';
    panel.innerHTML = '';
    document.querySelectorAll('.project-card').forEach(c => c.classList.remove('selected'));
  }

  /* ──────────────────────────────────────────
     US6 + US7 — AI Tab (Redundancy + Insights)
  ────────────────────────────────────────── */
  async function loadAI() {
    const el = document.getElementById('ai-content');
    el.innerHTML = '<p class="loading">Loading AI data…</p>';
    try {
      const [redData, insData] = await Promise.all([
        api('/api/v1/redundancy').catch(() => ({ clusters: [] })),
        api('/api/v1/insights').catch(() => ({ insights: [] })),
      ]);
      el.innerHTML = '';

      /* Redundancy */
      el.insertAdjacentHTML('beforeend', '<div class="ai-section"><h2 class="ai-heading">Duplicate &amp; Redundant Work</h2><div id="dup-section"></div></div>');
      const dupEl = document.getElementById('dup-section');
      const clusters = redData.clusters || [];
      if (!clusters.length) {
        dupEl.innerHTML = '<p class="empty">No duplicate work detected — great alignment!</p>';
      } else {
        const simClass = s => s >= 80 ? 'sim-high' : s >= 60 ? 'sim-medium' : 'sim-low';
        dupEl.innerHTML = `
          <div class="dup-grid">${clusters.map(c => {
            const shown = (c.teams || []).slice(0, 3);
            const extra = (c.teams || []).length > 3 ? ` +${c.teams.length - 3} more` : '';
            return `<div class="dup-card">
              <div class="dup-card-header"><span class="dup-theme">${escHtml(c.theme)}</span><span class="${simClass(c.similarity_score)}">${c.similarity_score}% match</span></div>
              <div class="dup-teams">${shown.map(t => `<span class="dup-team-tag">${escHtml(t)}</span>`).join('')}${extra ? `<span class="dup-team-tag">${escHtml(extra)}</span>` : ''}</div>
              <p class="dup-recommendation">💡 ${escHtml(c.recommendation)}</p>
            </div>`;
          }).join('')}</div>
          <div class="table-wrap" style="margin-bottom:8px"><table>
            <thead><tr><th>Duplicate Area</th><th>Teams Involved</th><th>Similarity</th><th>Recommendation</th></tr></thead>
            <tbody>${clusters.map(c => `<tr><td>${escHtml(c.theme)}</td><td>${(c.teams || []).join(', ')}</td><td><span class="${simClass(c.similarity_score)}">${c.similarity_score}%</span></td><td>${escHtml(c.recommendation)}</td></tr>`).join('')}</tbody>
          </table></div>`;
      }

      /* Insights */
      el.insertAdjacentHTML('beforeend', '<div class="ai-section"><h2 class="ai-heading">AI Insights</h2><div id="ins-section"></div></div>');
      const insEl = document.getElementById('ins-section');
      const insights = insData.insights || [];
      if (!insights.length) {
        insEl.innerHTML = '<p class="empty">No insights available yet. Check back after more data is synced.</p>';
      } else {
        insEl.innerHTML = `<div class="insights-list">${insights.map(ins => {
          const links = (ins.links || []).map(l => `<button class="insight-link" onclick="navigateTo('${escHtml(l.type)}', '${escHtml(l.id)}')">${escHtml(l.label)}</button>`).join('');
          return `<div class="insight-card">
            <p class="insight-body">${escHtml(ins.body)}</p>
            <div class="insight-sections">
              <div class="insight-row"><span class="insight-row-label">Evidence</span><span class="insight-row-value">${escHtml(ins.evidence)}</span></div>
              <div class="insight-row"><span class="insight-row-label">Impact</span><span class="insight-row-value">${escHtml(ins.impact)}</span></div>
              <div class="insight-row"><span class="insight-row-label">Recommended Action</span><span class="insight-row-value">${escHtml(ins.recommended_action)}</span></div>
            </div>
            ${links ? `<div class="insight-links">${links}</div>` : ''}
          </div>`;
        }).join('')}</div>`;
      }
    } catch {
      el.innerHTML = errHtml('Could not load AI data.', 'loadAI');
    }
  }

  /* ──────────────────────────────────────────
     Bootstrap
  ────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    loaded.add('section-overview');
    loadOrgOverview();
  });
</script>

</body>
</html>
